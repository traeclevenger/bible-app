<!doctype html>
<html><head><meta charset="utf-8"><title>Favicon variations</title>
<style>
  body { background: #0f1419; color: #e6e3dc; font-family: Arial, sans-serif; padding: 30px; }
  h1 { font-size: 14pt; font-weight: 600; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 760px; }
  .card { background: #161c23; border: 1px solid #2a323d; border-radius: 12px; padding: 18px; }
  .label { font-size: 11pt; color: #9aa3b0; margin-bottom: 14px; text-align: center; }
  .row { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 14px 0; }
  .sample { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sample .size { font-size: 9pt; color: #6b7480; }
  .light { background: #f5f5f5; padding: 8px; border-radius: 6px; }
  .dark  { background: #0f1419; padding: 8px; border-radius: 6px; }
  svg { display: block; }
</style></head>
<body>
<h1>Favicon variations — pick one</h1>
<div class="grid">

  <!-- A. Open book -->
  <div class="card">
    <div class="label">A. Open book</div>
    <div class="row">
      <div class="sample"><div class="dark"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15a1 1 0 0 0-1-1H2z"/><path d="M22 4.5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v15a1 1 0 0 1 1-1h9z"/></svg></div><div class="size">48px dark</div></div>
      <div class="sample"><div class="dark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15a1 1 0 0 0-1-1H2z"/><path d="M22 4.5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v15a1 1 0 0 1 1-1h9z"/></svg></div><div class="size">32px</div></div>
      <div class="sample"><div class="dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15a1 1 0 0 0-1-1H2z"/><path d="M22 4.5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v15a1 1 0 0 1 1-1h9z"/></svg></div><div class="size">16px</div></div>
      <div class="sample"><div class="light"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8a6a4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15a1 1 0 0 0-1-1H2z"/><path d="M22 4.5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v15a1 1 0 0 1 1-1h9z"/></svg></div><div class="size">light tab</div></div>
    </div>
  </div>

  <!-- B. Closed book with ribbon bookmark -->
  <div class="card">
    <div class="label">B. Closed book + ribbon bookmark</div>
    <div class="row">
      <div class="sample"><div class="dark"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h13a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H5a2 2 0 0 1 0-4h13"/><path d="M5 3a2 2 0 0 0 0 4"/><path d="M11 7v8l2-2 2 2V7"/></svg></div><div class="size">48px dark</div></div>
      <div class="sample"><div class="dark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h13a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H5a2 2 0 0 1 0-4h13"/><path d="M5 3a2 2 0 0 0 0 4"/><path d="M11 7v8l2-2 2 2V7"/></svg></div><div class="size">32px</div></div>
      <div class="sample"><div class="dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h13a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H5a2 2 0 0 1 0-4h13"/><path d="M5 3a2 2 0 0 0 0 4"/><path d="M11 7v8l2-2 2 2V7"/></svg></div><div class="size">16px</div></div>
      <div class="sample"><div class="light"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8a6a4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h13a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H5a2 2 0 0 1 0-4h13"/><path d="M5 3a2 2 0 0 0 0 4"/><path d="M11 7v8l2-2 2 2V7"/></svg></div><div class="size">light tab</div></div>
    </div>
  </div>

  <!-- C. Open book with page lines -->
  <div class="card">
    <div class="label">C. Open book with page lines</div>
    <div class="row">
      <div class="sample"><div class="dark"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c2.5 0 5 .5 7 2 0 5.5 0 9 0 13-2-1.5-4.5-2-7-2z"/><path d="M22 5c-2.5 0-5 .5-7 2 0 5.5 0 9 0 13 2-1.5 4.5-2 7-2z"/><path d="M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3"/></svg></div><div class="size">48px dark</div></div>
      <div class="sample"><div class="dark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c2.5 0 5 .5 7 2 0 5.5 0 9 0 13-2-1.5-4.5-2-7-2z"/><path d="M22 5c-2.5 0-5 .5-7 2 0 5.5 0 9 0 13 2-1.5 4.5-2 7-2z"/><path d="M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3"/></svg></div><div class="size">32px</div></div>
      <div class="sample"><div class="dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c2.5 0 5 .5 7 2 0 5.5 0 9 0 13-2-1.5-4.5-2-7-2z"/><path d="M22 5c-2.5 0-5 .5-7 2 0 5.5 0 9 0 13 2-1.5 4.5-2 7-2z"/></svg></div><div class="size">16px</div></div>
      <div class="sample"><div class="light"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8a6a4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c2.5 0 5 .5 7 2 0 5.5 0 9 0 13-2-1.5-4.5-2-7-2z"/><path d="M22 5c-2.5 0-5 .5-7 2 0 5.5 0 9 0 13 2-1.5 4.5-2 7-2z"/><path d="M4 9h3M4 12h3M4 15h3M17 9h3M17 12h3M17 15h3"/></svg></div><div class="size">light tab</div></div>
    </div>
  </div>

  <!-- D. Stack of books -->
  <div class="card">
    <div class="label">D. Stack of books</div>
    <div class="row">
      <div class="sample"><div class="dark"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 0 0 5H20"/><line x1="9" y1="6" x2="9" y2="14"/><line x1="14" y1="6" x2="14" y2="14"/></svg></div><div class="size">48px dark</div></div>
      <div class="sample"><div class="dark"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 0 0 5H20"/><line x1="9" y1="6" x2="9" y2="14"/><line x1="14" y1="6" x2="14" y2="14"/></svg></div><div class="size">32px</div></div>
      <div class="sample"><div class="dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d4a373" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 0 0 5H20"/></svg></div><div class="size">16px</div></div>
      <div class="sample"><div class="light"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8a6a4a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5a2.5 2.5 0 0 0 0 5H20"/><line x1="9" y1="6" x2="9" y2="14"/><line x1="14" y1="6" x2="14" y2="14"/></svg></div><div class="size">light tab</div></div>
    </div>
  </div>

</div>
</body></html>
